# ALSA UCM for the Microsoft Surface Duo (1st gen) - sdm845 machine driver card "SurfaceDuo" (2026-11-06).
# Mixer paths verified on the mainline workbench (tools/linux/initramfs/audiotest.sh, tools/linux/duo-mic-setup.sh,
# docs/research/workbench/audio-mics.md). Install under /usr/share/alsa/ucm2 (tools/linux/pmos/duo-pmos-prepare.sh).
Syntax 4

SectionUseCase."HiFi" {
	File "/Microsoft/SurfaceDuo/HiFi.conf"
	Comment "Speaker and microphones"
}

# fallback when the mic path fails to open (stuck DSP state): speaker only, so sound never silently disappears
SectionUseCase."Speaker" {
	File "/Microsoft/SurfaceDuo/Speaker.conf"
	Comment "Speaker only"
}
