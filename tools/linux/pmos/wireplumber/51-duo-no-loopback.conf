# Surface Duo (pmOS): hide the snd-aloop Loopback card (built into our kernel) from PipeWire, so the default sink and
# source are the phone's own speaker + microphones (UCM verb HiFi, tools/linux/pmos/ucm). Install in
# /etc/wireplumber/wireplumber.conf.d/ (tools/linux/pmos/duo-pmos-prepare.sh).
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-snd_aloop.0" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
