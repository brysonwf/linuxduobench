# Surface Duo speaker tuning (2026-11-07, request: "supply the tuning and polish for the speaker").
# The raw speaker path has no EQ or loudness processing (Android runs Microsoft's ACDB EQ + MBDRC in the ADSP): soft
# system sounds such as the login chime were nearly inaudible. Measured with the phone's own mics (duo-speaker-measure.py,
# 1/3-octave, relative to 1-4 kHz): nothing usable below ~400 Hz (-15..-27 dB), a honky bump at 630 Hz-1 kHz (+3..+6), a
# dip at 1.6-2.5 kHz (-1..-4), a strong top end (partly the mics' near field - left alone).
# Chain per channel: high-pass 350 Hz (no amp power wasted on bass the speaker cannot play) -> -4 dB at 800 Hz ->
# +3 dB at 2 kHz -> ZaMaximX2 limiter (Threshold -8 dB = +8 dB make-up gain, ceiling -1 dBFS).
# A virtual sink "Speaker" (the default output) feeds the real speaker; Phosh's volume controls it.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Speaker"
      media.name       = "Surface Duo speaker tuning"
      filter.graph = {
        nodes = [
          { type = builtin name = hp_l   label = bq_highpass control = { "Freq" = 350.0  "Q" = 0.707 } }
          { type = builtin name = hp_r   label = bq_highpass control = { "Freq" = 350.0  "Q" = 0.707 } }
          { type = builtin name = mid_l  label = bq_peaking  control = { "Freq" = 800.0  "Q" = 1.0 "Gain" = -4.0 } }
          { type = builtin name = mid_r  label = bq_peaking  control = { "Freq" = 800.0  "Q" = 1.0 "Gain" = -4.0 } }
          { type = builtin name = pres_l label = bq_peaking  control = { "Freq" = 2000.0 "Q" = 1.2 "Gain" = 3.0 } }
          { type = builtin name = pres_r label = bq_peaking  control = { "Freq" = 2000.0 "Q" = 1.2 "Gain" = 3.0 } }
          { type = ladspa  name = lim plugin = /usr/lib/ladspa/ZaMaximX2-ladspa.so label = ZaMaximX2
            control = { "Threshold" = -8.0 "Output Ceiling" = -1.0 "Release" = 10.0 } }
        ]
        links = [
          { output = "hp_l:Out"   input = "mid_l:In" }
          { output = "mid_l:Out"  input = "pres_l:In" }
          { output = "pres_l:Out" input = "lim:Audio Input 1" }
          { output = "hp_r:Out"   input = "mid_r:In" }
          { output = "mid_r:Out"  input = "pres_r:In" }
          { output = "pres_r:Out" input = "lim:Audio Input 2" }
        ]
        inputs  = [ "hp_l:In" "hp_r:In" ]
        outputs = [ "lim:Audio Output 1" "lim:Audio Output 2" ]
      }
      capture.props = {
        node.name        = "duo_speaker_tuned"
        media.class      = Audio/Sink
        audio.position   = [ FL FR ]
        priority.session = 2000
        priority.driver  = 2000
      }
      playback.props = {
        node.name        = "duo_speaker_tuned.out"
        node.passive     = true
        audio.position   = [ FL FR ]
        target.object    = "alsa_output.platform-sound.HiFi__Speaker__sink"
        stream.dont-remix = true
      }
    }
  }
]
