# /etc/systemd/system/waydroid-container.service.d/duo-nft.conf (Surface Duo, Debian, 2026-11-08)
# Waydroid's network script hard-codes LXC_USE_NFT="false" and then uses iptables-legacy, but our kernel has nftables
# only (no ip_tables / legacy mangle table) -> "Command failed: waydroid-net.sh start", no Android session. Switch the
# script to its nft path before every container start (re-applied after a waydroid upgrade).
[Service]
ExecStartPre=/bin/sed -i 's/^LXC_USE_NFT="false"/LXC_USE_NFT="true"/' /usr/lib/waydroid/data/scripts/waydroid-net.sh
