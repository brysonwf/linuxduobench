#!/usr/sbin/nft -f
# SPDX-License-Identifier: GPL-2.0-or-later
# Surface Duo on Debian (2026-11-08): the pmOS allowlist (tools/linux/pmos/nftables/02_duo_trusted_only.nft) as a
# complete ruleset - Debian has no base ruleset to extend. Inbound only from loopback, the USB link to the PC and Wi-Fi;
# everything else (the modem's duo-qmi* / rmnet* interfaces) is dropped, except replies to connections the phone opened.
# Outbound stays open. Installed as /etc/nftables.conf, loaded by nftables.service.
# reset OUR table only: OpenSnitch (the allow/deny pop-up firewall) keeps its own tables, a reload must not wipe them
table inet filter
flush table inet filter

table inet filter {
	chain input {
		type filter hook input priority filter; policy accept;
		ct state established,related accept
		iifname != "lo" iifname != "usb*" iifname != "wlan*" iifname != "p2p-wlan*" iifname != "waydroid0" drop comment "Duo: inbound only on lo, USB, Wi-Fi, Waydroid's bridge"
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
		# Waydroid (Android apps): its bridge may go out; only replies come back in (2026-11-08: no IP without this)
		iifname "waydroid0" accept
		oifname "waydroid0" ct state established,related accept
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
