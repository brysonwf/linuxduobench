# Surface Duo: the speaker's starting volume 70 % instead of WirePlumber's 40 % (2026-11-08: "I thought you
# added 12 db to the speaker?" -> the DSP keeps its listening-tested +8 dB makeup gain, the loudness comes from the
# volume slider: 40 % -> 70 % is about +9 dB more on WirePlumber's cubic scale, with no loss of headroom).
# Applies to outputs without a saved volume (a user's own setting always wins). WirePlumber 0.5 setting, linear: 0.7^3.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.343
}
