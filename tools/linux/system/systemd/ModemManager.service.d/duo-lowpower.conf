# Surface Duo: the modem must be in low-power before ModemManager enables it (online straight from the boot state
# crashes the modem and Wi-Fi with it). Runs for every start of ModemManager, D-Bus activation included.
[Service]
ExecStartPre=-/usr/libexec/duo/duo-modem-lowpower
TimeoutStartSec=150
